name: Gerar APK RD GAME

on:
  workflow_dispatch:
  push:
    paths:
      - 'RD_GAME_Android_Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto
        run: |
          unzip -q RD_GAME_Android_Project.zip

      - name: Compilar APK
        working-directory: RD_GAME_Android_Project
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RD-GAME-APK
          path: RD_GAME_Android_Project/app/build/outputs/apk/debug/app-debug.apk
